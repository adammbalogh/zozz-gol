services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gol
      POSTGRES_PASSWORD: gol
      POSTGRES_DB: gol
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gol -d gol"]
      interval: 2s
      retries: 30

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://gol:gol@db:5432/gol
    volumes:
      - ./api:/app
      - /app/node_modules
    command: ["node", "--watch", "server.js"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      retries: 30

  web:
    image: nginx:alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8090:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 3s
      retries: 20

volumes:
  dbdata:
